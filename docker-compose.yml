services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: needs_food
      POSTGRES_USER: needs_food
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U needs_food -d needs_food"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - needs_food_postgres:/var/lib/postgresql/data
    restart: unless-stopped
  app:
    build: .
    ports:
      - "8501:8501"
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL using postgres as the hostname}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
volumes:
  needs_food_postgres:
